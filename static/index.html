                                    <div class="setting-row"><label>Anti-Flicker</label>
                                        <select class="setting-select" data-setting="antiflicker">
                                            <option value="0">Off</option>
                                            <option value="1">50Hz</option>
                                            <option value="2">60Hz</option>
                                        </select>
                                    </div>
                                    <div class="setting-row"><label>Meter Mode</label>
                                        <select class="setting-select" data-setting="meter">
                                            <option value="0">Average</option>
                                            <option value="1">Center-Weighted</option>
                                            <option value="2">Smart</option>
                                            <option value="3">Top</option>
                                        </select>
                                    </div>
                                    <div class="setting-row setting-row-inline">
                                        <label>Exp Comp Enable</label>
                                        <label class="toggle-switch"><input type="checkbox" data-setting="expcomp_mode"><span class="toggle-slider"></span></label>
                                    </div>
                                    <div class="setting-row setting-row-inline">
                                        <label>Backlight</label>
                                        <label class="toggle-switch"><input type="checkbox" data-setting="backlight"><span class="toggle-slider"></span></label>
                                    </div>
                                </div>

                                <!-- Color -->
                                <div class="settings-inner-pane" data-spane="color">
                                    <div class="setting-row"><label>WB Mode</label>
                                        <select class="setting-select" data-setting="wb_mode">
                                            <option value="0">Auto</option>
                                            <option value="1">Indoor</option>
                                            <option value="2">Outdoor</option>
                                            <option value="3">One Push WB</option>
                                            <option value="5">Manual</option>
                                            <option value="20">Temperature</option>
                                        </select>
                                    </div>
                                    ${[
                                        { p:'rgain_tuning', label:'Red Tuning',  min:0, max:20, val:10 },
                                        { p:'bgain_tuning', label:'Blue Tuning', min:0, max:20, val:10 },
                                        { p:'rgain',        label:'Red Gain',   min:0, max:255, val:128 },
                                        { p:'bgain',        label:'Blue Gain',  min:0, max:255, val:128 },
                                    ].map(s => `<div class="setting-row"><label>${s.label}<span>${s.val}</span></label><input type="range" data-setting="${s.p}" min="${s.min}" max="${s.max}" value="${s.val}"></div>`).join('')}
                                    <div class="setting-row"><label>AWB Sensitivity</label>
                                        <select class="setting-select" data-setting="awb_sensitivity">
                                            <option value="0">High</option>
                                            <option value="1">Normal</option>
                                            <option value="2">Low</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="iec-wrap">
                                    <div class="iec-section-label">IEC Profiles</div>
                                    <div class="iec-input-row">
                                        <input type="text" class="iec-name-input" placeholder="Profile name">
                                        <button class="iec-save-btn">Save</button>
                                    </div>
                                    <div class="iec-profile-list"></div>
                                    <div class="iec-section-label">Apply to presets</div>
                                    <div class="iec-input-row">
                                        <input type="text" class="iec-presets-input" placeholder="e.g. 1-5, 4, 3">
                                        <button class="iec-apply-btn">Apply</button>
                                    </div>
                                    <div class="iec-status"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Remove camera from slot button
                sec.querySelector('.slot-remove-btn').addEventListener('click', e => {
                    e.stopPropagation();
                    removeCameraFromSlot(i);
                });

                // Select section on click
                sec.addEventListener('click', e => {
                    if (e.target.closest('.cam-tab')) return;
                    if (currentLayout === 1 ? stagingCamera : sectionCameras[i]) { clearSlotSelection(); return; }
                    if (e.target.closest('.cam-controls')) return;
                    if (selectedSlot === i) { clearSlotSelection(); return; }
                    selectSlot(i);
                });

                // Tab switching
                sec.querySelectorAll('.cam-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        const name = tab.dataset.tab;
                        sectionTabs[i] = name;
                        sec.querySelectorAll('.cam-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
                        sec.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.dataset.pane === name));
                    });
                });

                // ── PTZ wiring ─────────────────────────────────
                const getIp = () => getSlotIp(i);
                let activePtzDir = null;
                let activePtzBtn = null;
                let isMoving = false;
                let ptzStartTime = 0;
                const PTZ_MIN_MS = 200;  // minimum ms between start and stop so camera has time to process

                // D-pad: pointerdown starts move, pointerup/pointercancel stops.
                // Using Pointer Events avoids the 300 ms synthetic-mouse delay on
                // tablets and eliminates the touch+mouse dual-fire race condition.
                sec.querySelectorAll('[data-ptz]').forEach(btn => {
                    const dir = btn.dataset.ptz;
                    if (dir === 'home') {
                        btn.addEventListener('pointerdown', e => {
                            e.preventDefault();
                            const ip = getIp(); if (!ip) return;
                            cgi(ip, '/cgi-bin/ptzctrl.cgi?ptzcmd&home');
                        });
                        return;
                    }
                    const getPtzSpeed = () => parseInt(sec.querySelector('.ptz-speed')?.value || 8);

                    const start = (e) => {
                        const ip = getIp(); if (!ip) return;
                        e.preventDefault();

                        activePtzDir = dir;
                        activePtzBtn = btn;
                        isMoving = true;
                        ptzStartTime = Date.now();
                        btn.classList.add('pressed');
                        const spd = getPtzSpeed();
                        activeMove = { ip, cmd: 'ptzstop' };
                        cgi(ip, `/cgi-bin/ptzctrl.cgi?ptzcmd&${dir}&${spd}&${spd}`);
                    };

                    const stop = () => {
                        const ip = getIp();
                        activePtzDir = null;
                        isMoving = false;
                        if (activePtzBtn) activePtzBtn.classList.remove('pressed');
                        activePtzBtn = null;
                        activeMove = null;
                        if (!ip) return;
                        const delay = Math.max(0, PTZ_MIN_MS - (Date.now() - ptzStartTime));
                        setTimeout(() => cgi(ip, '/cgi-bin/ptzctrl.cgi?ptzcmd&ptzstop'), delay);
                    };

                    btn.addEventListener('pointerdown', start);
                    btn.addEventListener('pointerup', stop);
                    btn.addEventListener('pointercancel', stop);
                    btn.addEventListener('touchstart', start);
                    btn.addEventListener('touchend', stop);
                    btn.addEventListener('touchcancel', stop);
                    btn.addEventListener('mousedown', start);
                    btn.addEventListener('mouseup', stop);
                    btn.addEventListener('contextmenu', e => e.preventDefault());
                });

                // Fallback: send stop on any pointer/touch/mouse release (only if movement active)
                const sendPtzStop = () => {
                    if (!isMoving) return;
                    const ip = getIp();
                    isMoving = false;
                    if (ip) cgi(ip, '/cgi-bin/ptzctrl.cgi?ptzcmd&ptzstop');
                };
                document.addEventListener('pointerup', sendPtzStop);
                document.addEventListener('touchend', sendPtzStop);
                document.addEventListener('mouseup', sendPtzStop);

                // Zoom slider (VISCA direct)
                const zoomSlider = sec.querySelector('.zoom-slider');
                if (zoomSlider) {
                    zoomSlider.value = zoomPosition[i] ?? 0;
                    let zoomTimer = null;
                    zoomSlider.addEventListener('input', () => {
                        const ip = getIp(); if (!ip) return;
                        const pos = +zoomSlider.value;
                        zoomPosition[i] = pos;
                        clearTimeout(zoomTimer);
                        zoomTimer = setTimeout(() => {
                            saveCameras();
                            fetch('/api/visca', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ip, type: 'zoom', position: pos }) });
                        }, 80);
                    });
                    sec.querySelectorAll('[data-nudge="zoom"]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            zoomSlider.value = Math.max(0, Math.min(16384, +zoomSlider.value + +btn.dataset.delta));
                            zoomSlider.dispatchEvent(new Event('input'));
                        });
                    });
                }

                // Focus slider (VISCA direct) + AF button
                const focusSlider = sec.querySelector('.focus-slider');
                if (focusSlider) {
                    focusSlider.value = focusPosition[i] ?? 8192;
                    let focusTimer = null;
                    focusSlider.addEventListener('input', () => {
                        const ip = getIp(); if (!ip) return;
                        const pos = +focusSlider.value;
                        focusPosition[i] = pos;
                        clearTimeout(focusTimer);
                        focusTimer = setTimeout(() => {
                            saveCameras();
                            fetch('/api/visca', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ip, type: 'focus', position: pos }) });
                        }, 80);
                    });
                    sec.querySelectorAll('[data-nudge="focus"]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            focusSlider.value = Math.max(0, Math.min(16384, +focusSlider.value + +btn.dataset.delta));
                            focusSlider.dispatchEvent(new Event('input'));
                        });
                    });
                }

                const afBtn = sec.querySelector('.af-btn');
                if (afBtn) {
                    afBtn.classList.toggle('af-on', !!afState[i]);
                    afBtn.addEventListener('click', () => {
                        const ip = getIp(); if (!ip) return;
                        const on = afBtn.classList.toggle('af-on');
                        afState[i] = on;
                        saveCameras();
                        cgi(ip, on ? '/cgi-bin/param.cgi?ptzcmd&unlock_mfocus' : '/cgi-bin/param.cgi?ptzcmd&lock_mfocus');
                    });
                }

                // Presets: click = call, hold 600ms = set
                const confirmDiv      = sec.querySelector('.preset-confirm');
                const confirmNum      = sec.querySelector('.preset-confirm-num');
                const confirmNameInput = sec.querySelector('.preset-confirm-name');

                const showPresetConfirm = (n) => {
                    const camId = currentLayout === 1 ? stagingCamera : sectionCameras[i];
                    confirmNum.textContent = n;
                    confirmNameInput.value = (camId && presetNames[camId]?.[n]) || '';
                    confirmDiv.dataset.pendingPreset = n;
                    confirmDiv.classList.add('visible');
                    confirmNameInput.focus();
                };

                sec.querySelector('.preset-confirm-cancel').addEventListener('click', () => {
                    confirmDiv.classList.remove('visible');
                });

                sec.querySelector('.preset-confirm-ok').addEventListener('click', async () => {
                    const n  = confirmDiv.dataset.pendingPreset;
                    const ip = getIp();
                    confirmDiv.classList.remove('visible');
                    if (!ip) return;
                    await cgi(ip, `/cgi-bin/ptzctrl.cgi?ptzcmd&posset&${n}`);
                    const name  = confirmNameInput.value.trim();
                    const camId = currentLayout === 1 ? stagingCamera : sectionCameras[i];
                    if (camId) {
                        if (!presetNames[camId]) presetNames[camId] = {};
                        if (name) presetNames[camId][n] = name;
                        else delete presetNames[camId][n];
                        updatePresetLabels(i);
                        saveCameras();
                    }
                });

                confirmNameInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter')  sec.querySelector('.preset-confirm-ok').click();
                    if (e.key === 'Escape') sec.querySelector('.preset-confirm-cancel').click();
                });

                sec.querySelectorAll('.preset-btn').forEach(btn => {
                    const n = btn.dataset.preset;
                    let holdTimer = null;
                    let presetPointerId = null;

                    const startPress = (e) => {
                        if (presetPointerId !== null) return;
                        e.preventDefault();
                        btn.setPointerCapture(e.pointerId);
                        presetPointerId = e.pointerId;
                        btn.classList.add('pressed');
                        holdTimer = setTimeout(() => {
                            holdTimer = null;
                            btn.classList.add('holding');
                            setTimeout(() => btn.classList.remove('holding'), 400);
                            showPresetConfirm(n);
                        }, 600);
                    };
                    const endPress = (e) => {
                        if (e && e.pointerId !== presetPointerId) return;
                        presetPointerId = null;
                        btn.classList.remove('pressed');
                        if (holdTimer) {
                            clearTimeout(holdTimer);
                            holdTimer = null;
                            const ip = getIp(); if (!ip) return;
                            cgi(ip, `/cgi-bin/ptzctrl.cgi?ptzcmd&poscall&${n}`);
                        }
                    };
                    const cancelPress = (e) => {
                        if (e && e.pointerId !== presetPointerId) return;
                        presetPointerId = null;
                        btn.classList.remove('pressed');
                        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
                    };
                    btn.addEventListener('pointerdown',   startPress);
                    btn.addEventListener('pointerup',     endPress);
                    btn.addEventListener('pointercancel', cancelPress);
                    btn.addEventListener('contextmenu', e => e.preventDefault());
                });

                // ── Settings inner tab switching ───────────────
                sec.querySelectorAll('.settings-inner-tab').forEach(stab => {
                    stab.addEventListener('click', () => {
                        const name = stab.dataset.stab;
                        sec.querySelectorAll('.settings-inner-tab').forEach(t => t.classList.toggle('active', t.dataset.stab === name));
                        sec.querySelectorAll('.settings-inner-pane').forEach(p => p.classList.toggle('active', p.dataset.spane === name));
                        if (name === 'exposure' || name === 'color') {
                            loadImageSettings();
                        }
                    });
                });

                // ── Settings wiring ────────────────────────────
                // Parse key="value" or key=value lines from CGI response
                const parseConf = text => {
                    const vals = {};
                    text.split(/[\r\n]+/).forEach(line => {
                        const m = line.match(/(\w+)\s*=\s*"?([^"\s]*)"?/);
                        if (m) vals[m[1]] = m[2];
                    });
                    return vals;
                };

                const applyValsToControls = vals => {
                    sec.querySelectorAll('[data-setting]').forEach(el => {
                        const key = el.dataset.setting;
                        if (vals[key] === undefined) return;
                        const v = vals[key];
                        if (el.type === 'checkbox') {
                            el.checked = v !== '0' && v !== 'false';
                        } else {
                            el.value = v;
                            const span = el.closest('.setting-row')?.querySelector('label span');
                            if (span) span.textContent = v;
                        }
                    });
                };

                // ── VISCA raw helper ───────────────────────────
                const viscaRaw = async (cmd) => {
                    const ip = getIp(); if (!ip) return null;
                    try {
                        const r = await fetch(`/api/visca-raw/${ip}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ cmd })
                        });
                        if (!r.ok) return null;
                        const d = await r.json();
                        return d.resp || null; // array of bytes
                    } catch { return null; }
                };

                // Decode a 4-nibble VISCA direct value from inquiry response bytes
                // Response format for direct-value inquiries: 90 50 0p 0q 0r 0s FF
                // returns (p<<12)|(q<<8)|(r<<4)|s
                const decodeNibbles = resp => {
                    if (!resp || resp.length < 7) return null;
                    return ((resp[2] & 0xF) << 12) | ((resp[3] & 0xF) << 8) | ((resp[4] & 0xF) << 4) | (resp[5] & 0xF);
                };

                // Decode a 2-nibble VISCA value (90 50 0p 0q FF) → (p<<4)|q
                const decodeNibbles2 = resp => {
                    if (!resp || resp.length < 5) return null;
                    return ((resp[2] & 0xF) << 4) | (resp[3] & 0xF);
                };

                // Decode single-nibble value at byte[2] (90 50 0p FF)
                const decodeByte = resp => {
                    if (!resp || resp.length < 4) return null;
                    return resp[2] & 0xF;
                };

                const base64ToBytes = (str) => {
                    if (typeof str !== 'string') return str; // already bytes
                    try {
                        return new Uint8Array(atob(str).split('').map(c => c.charCodeAt(0)));
                    } catch {
                        return null;
                    }
                };

                const loadImageSettings = async () => {
                    const ip = getIp(); if (!ip) return;

                    // Fire all VISCA inquiries in parallel
                    const rawResponses = await Promise.all([
                        viscaRaw([0x81,0x09,0x04,0x35,0xFF]),  // WB mode
                        viscaRaw([0x81,0x09,0x04,0x43,0xFF]),  // R Gain
                        viscaRaw([0x81,0x09,0x04,0x44,0xFF]),  // B Gain
                        viscaRaw([0x81,0x09,0x04,0x12,0xFF]),  // R Tuning
                        viscaRaw([0x81,0x09,0x04,0x13,0xFF]),  // B Tuning
                        viscaRaw([0x81,0x09,0x04,0x39,0xFF]),  // AE mode
                        viscaRaw([0x81,0x09,0x04,0x4A,0xFF]),  // Shutter → 90 50 0p 0q FF
                        viscaRaw([0x81,0x09,0x04,0x4B,0xFF]),  // Iris    → 90 50 0p 0q FF
                        viscaRaw([0x81,0x09,0x04,0x4C,0xFF]),  // Gain    → 90 50 0p 0q FF
                        viscaRaw([0x81,0x09,0x04,0x3E,0xFF]),  // ExpComp on/off
                        viscaRaw([0x81,0x09,0x04,0x4E,0xFF]),  // ExpComp level
                        viscaRaw([0x81,0x09,0x04,0x33,0xFF]),  // Backlight
                        viscaRaw([0x81,0x09,0x04,0x55,0xFF]),  // Flicker inquiry
                        viscaRaw([0x81,0x09,0x04,0x42,0xFF]),  // Sharpness
                        viscaRaw([0x81,0x09,0x04,0x49,0xFF]),  // Color Gain
                        viscaRaw([0x81,0x09,0x04,0x4F,0xFF]),  // Hue
                        viscaRaw([0x81,0x09,0x04,0xA1,0xFF]),  // Brightness
                        viscaRaw([0x81,0x09,0x04,0xA2,0xFF]),  // Contrast
                        viscaRaw([0x81,0x09,0x04,0xA9,0xFF]),  // AWB Sensitivity
                        viscaRaw([0x81,0x09,0x04,0x53,0xFF]),  // NR2D → 90 50 0p FF
                        viscaRaw([0x81,0x09,0x04,0x54,0xFF]),  // NR3D → 90 50 0p FF
                        viscaRaw([0x81,0x09,0x04,0x2C,0xFF]),  // Gain Limit → 90 50 0q FF
                    ]);

                    // Decode base64 responses to byte arrays
                    const [
                        wbResp, rGainResp, bGainResp,
                        rTuningResp, bTuningResp,
                        aeResp, shutResp, irisResp, gainResp,
                        expCompOnResp, expCompLvlResp,
                        backlightResp, flickerResp,
                        sharpResp, colorGainResp, hueResp,
                        brightResp, contrastResp, awbSensResp,
                        nr2dResp, nr3dResp, gainLimitResp
                    ] = rawResponses.map(base64ToBytes);

                    const vals = {};
                    const b = (r, i) => r && r.length > i ? r[i] & 0xF : null;
                    // 2-nibble value at bytes [2][3]: (p<<4)|q
                    const n2 = (r) => r && r.length >= 5 ? ((r[2]&0xF)<<4)|(r[3]&0xF) : null;
                    // 2-nibble value at bytes [4][5]
                    const n2hi = (r) => r && r.length >= 7 ? ((r[4]&0xF)<<4)|(r[5]&0xF) : null;

                    // WB mode: 90 50 0p FF
                    const wm = b(wbResp, 2); if (wm !== null) vals.wb_mode = String(wm);

                    // R/B Gain: 90 50 00 00 0p 0q FF → pq byte = 0–255
                    const rg = n2hi(rGainResp); if (rg !== null) vals.rgain = String(rg);
                    const bg = n2hi(bGainResp); if (bg !== null) vals.bgain = String(bg);

                    // R/B Tuning: 90 50 00 00 0p 0q FF → 0x00–0x14 (slider 0–20)
                    const rt = n2hi(rTuningResp); if (rt !== null) vals.rgain_tuning = String(rt);
                    const bt = n2hi(bTuningResp); if (bt !== null) vals.bgain_tuning = String(bt);

                    // AE mode: 90 50 0p FF
                    const ae = b(aeResp, 2); if (ae !== null) vals.exposure_mode = String(ae);

                    // Shutter/Iris/Gain: 90 50 00 00 0p 0q FF → (p<<4)|q at bytes [4][5]
                    const sh = n2hi(shutResp); if (sh !== null) vals.shutter = String(sh);
                    const ir = n2hi(irisResp); if (ir !== null) vals.iris = String(ir);
                    const gn = b(gainResp, 5); if (gn !== null) vals.manual_gain = String(gn);

                    // ExpComp: 90 50 0p FF (02=on)
                    const ec = b(expCompOnResp, 2); if (ec !== null) vals.expcomp_mode = ec === 2 ? '1' : '0';
                    const el = n2hi(expCompLvlResp); if (el !== null) vals.expcomp_level = String(el);

                    // Backlight: 90 50 0p FF (02=on)
                    const bl = b(backlightResp, 2); if (bl !== null) vals.backlight = bl === 2 ? '1' : '0';

                    // Flicker: 90 50 0p FF
                    const fl = b(flickerResp, 2); if (fl !== null) vals.antiflicker = String(fl);

                    // Sharpness: 90 50 00 00 0p 0q FF
                    const sp = n2hi(sharpResp); if (sp !== null) vals.sharpness = String(sp);

                    // Color Gain (saturation): 90 50 00 00 00 0p FF — last nibble 0–14
                    const cg = b(colorGainResp, 5); if (cg !== null) vals.saturation = String(cg);

                    // Hue: 90 50 00 00 00 0p FF
                    const hu = b(hueResp, 5); if (hu !== null) vals.hue = String(hu);

                    // Brightness/Contrast: 90 50 00 00 0p 0q FF
                    const br = n2hi(brightResp); if (br !== null) vals.bright = String(br);
                    const co = n2hi(contrastResp); if (co !== null) vals.contrast = String(co);

                    // AWB Sensitivity: 90 50 0p FF
                    const as = b(awbSensResp, 2); if (as !== null) vals.awb_sensitivity = String(as);

                    // NR2D/NR3D: 90 50 0p FF
                    const n2d = b(nr2dResp, 2); if (n2d !== null) vals.nr2d = String(n2d);
                    const n3d = b(nr3dResp, 2); if (n3d !== null) vals.nr3d = String(n3d);

                    // Gain Limit: 90 50 0q FF (byte 3)
                    const gl = b(gainLimitResp, 3); if (gl !== null) vals.gain_limit = String(gl);

                    applyValsToControls(vals);

                    // CGI fallback for gamma/style, drc, meter (no VISCA equivalent)
                    try {
                        const [adv, basic] = await Promise.all([
                            fetch(`/api/cgi/${ip}?q=${encodeURIComponent('/cgi-bin/param.cgi?get_advance_image_conf')}`).then(r => r.text()),
                            fetch(`/api/cgi/${ip}?q=${encodeURIComponent('/cgi-bin/param.cgi?get_image_conf')}`).then(r => r.text()),
                        ]);
                        const cgiVals = { ...parseConf(adv), ...parseConf(basic) };
                        const viscaKeys = new Set(Object.keys(vals));
                        const cgiOnly = Object.fromEntries(Object.entries(cgiVals).filter(([k]) => !viscaKeys.has(k)));
                        applyValsToControls(cgiOnly);
                    } catch(e) {}
                };

                // Sliders: update display live, write on release
                sec.querySelectorAll('[data-setting][type="range"]').forEach(input => {
                    input.addEventListener('input', () => {
                        const span = input.closest('.setting-row')?.querySelector('label span');
                        if (span) span.textContent = input.value;
                    });
                    input.addEventListener('change', () => {
                        const ip = getIp(); if (!ip) return;
                        postSetting(ip, input.dataset.setting, input.value);
                    });
                });

                // Selects: write on change
                sec.querySelectorAll('.setting-select[data-setting]').forEach(sel => {
                    sel.addEventListener('change', () => {
                        const ip = getIp(); if (!ip) return;
                        postSetting(ip, sel.dataset.setting, sel.value);
                    });
                });

                // Checkboxes: write on change (1/0)
                sec.querySelectorAll('[data-setting][type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', () => {
                        const ip = getIp(); if (!ip) return;
                        postSetting(ip, cb.dataset.setting, cb.checked ? 1 : 0);
                    });
                });

                // ── Reset to defaults ──────────────────────────
                const settingsDefaults = {
                    // ranges (data-setting: default value)
                    bright:        7,
                    saturation:    7,
                    contrast:      7,
                    sharpness:     6,
                    hue:           7,
                    nr3d:          4,
                    nr2d:          1,
                    gain_limit:    7,
                    manual_gain:   0,
                    drc:           3,
                    expcomp_level: 7,
                    rgain_tuning:  10,
                    bgain_tuning:  10,
                    rgain:         128,
                    bgain:         128,
                    // selects
                    style:         '0',
                    exposure_mode: '0',
                    shutter:       '0',
                    iris:          '0',
                    antiflicker:   '0',
                    meter:         '0',
                    wb_mode:       '0',
                    awb_sensitivity: '1',
                    // checkboxes
                    expcomp_mode:  false,
                    backlight:     false,
                };

                const resetBtn     = sec.querySelector('.settings-reset-btn');
                const resetConfirm = sec.querySelector('.settings-reset-confirm');
                const resetYes     = sec.querySelector('.settings-reset-confirm-yes');
                const resetNo      = sec.querySelector('.settings-reset-confirm-no');

                resetBtn.addEventListener('click', () => {
                    resetBtn.style.display = 'none';
                    resetConfirm.classList.add('visible');
                });
                resetNo.addEventListener('click', () => {
                    resetConfirm.classList.remove('visible');
                    resetBtn.style.display = '';
                });
                resetYes.addEventListener('click', async () => {
                    resetConfirm.classList.remove('visible');
                    resetBtn.style.display = '';
                    const ip = getIp(); if (!ip) return;

                    // Apply defaults to UI controls
                    sec.querySelectorAll('[data-setting]').forEach(el => {
                        const key = el.dataset.setting;
                        if (!(key in settingsDefaults)) return;
                        const def = settingsDefaults[key];
                        if (el.type === 'checkbox') {
                            el.checked = !!def;
                        } else {
                            el.value = def;
                            const span = el.closest('.setting-row')?.querySelector('label span');
                            if (span) span.textContent = def;
                        }
                    });

                    // Send all defaults to camera
                    for (const [key, val] of Object.entries(settingsDefaults)) {
                        const cgiVal = typeof val === 'boolean' ? (val ? 1 : 0) : val;
                        await postSetting(ip, key, cgiVal);
                    }
                });

                // ── IEC Profiles wiring ────────────────────────

                // Route a single setting key+value to VISCA (preferred) or CGI fallback
                const postSetting = async (ip, key, val) => {
                    const v = +val;

                    // Helper: build direct-set nibble packet (81 01 04 XX 00 00 0p 0q FF)
                    const nibs = (sub, n16) => {
                        const n = n16 & 0xFFFF;
                        return [0x81,0x01,0x04,sub,0x00,0x00,(n>>4)&0xF,n&0xF,0xFF];
                    };
                    const nibsFull = (sub, n16) => {
                        const n = n16 & 0xFFFF;
                        return [0x81,0x01,0x04,sub,(n>>12)&0xF,(n>>8)&0xF,(n>>4)&0xF,n&0xF,0xFF];
                    };

                    const send = cmd => fetch(`/api/visca-raw/${ip}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cmd })
                    });

                    switch (key) {
                        case 'wb_mode':
                            // 81 01 04 35 0p FF
                            return send([0x81,0x01,0x04,0x35,v&0xF,0xFF]);
                        case 'rgain':
                            return send(nibs(0x43, v));
                        case 'bgain':
                            return send(nibs(0x44, v));
                        case 'exposure_mode':
                            // 81 01 04 39 0p FF
                            return send([0x81,0x01,0x04,0x39,v&0xF,0xFF]);
                        case 'shutter':
                            return send(nibs(0x4A, v));
                        case 'iris':
                            return send(nibs(0x4B, v));
                        case 'manual_gain':
                            return send(nibs(0x4C, v));
                        case 'expcomp_mode':
                            // 81 01 04 3E 02/03 FF
                            return send([0x81,0x01,0x04,0x3E,v ? 0x02 : 0x03,0xFF]);
                        case 'expcomp_level':
                            return send(nibs(0x4E, v));
                        case 'backlight':
                            return send([0x81,0x01,0x04,0x33,v ? 0x02 : 0x03,0xFF]);
                        case 'antiflicker':
                            // 81 01 04 23 0p FF
                            return send([0x81,0x01,0x04,0x23,v&0xF,0xFF]);
                        case 'sharpness':
                            return send(nibs(0x42, v));
                        case 'saturation':
                            // Color Gain: 81 01 04 49 00 00 00 0p FF
                            return send([0x81,0x01,0x04,0x49,0x00,0x00,0x00,v&0xF,0xFF]);
                        case 'hue':
                            return send([0x81,0x01,0x04,0x4F,0x00,0x00,0x00,v&0xF,0xFF]);
                        case 'bright':
                            return send(nibs(0xA1, v));
                        case 'contrast':
                            return send(nibs(0xA2, v));
                        case 'awb_sensitivity':
                            // 81 01 04 A9 0p FF
                            return send([0x81,0x01,0x04,0xA9,v&0xF,0xFF]);
                        case 'rgain_tuning':
                            // CAM_RTuning: 81 0A 01 12 pq FF — pq is single byte 0x00–0x14
                            return send([0x81,0x0A,0x01,0x12,v&0xFF,0xFF]);
                        case 'bgain_tuning':
                            return send([0x81,0x0A,0x01,0x13,v&0xFF,0xFF]);
                        // CGI-only fallbacks
                        case 'style':
                            return cgi(ip, `/cgi-bin/param.cgi?post_image_value&style&${val}`);
                        case 'nr2d':
                            return cgi(ip, `/cgi-bin/param.cgi?post_image_value&nr2d_level&${val}`);
                        case 'nr3d':
                            return cgi(ip, `/cgi-bin/param.cgi?post_image_value&nr3d_level&${val}`);
                        case 'drc':
                            return cgi(ip, `/cgi-bin/param.cgi?post_image_value&drc_level&${val}`);
                        case 'gain_limit':
                        case 'meter':
                            return cgi(ip, `/cgi-bin/param.cgi?post_image_value&${key}&${val}`);
                        default:
                            return cgi(ip, `/cgi-bin/param.cgi?post_image_value&${key}&${val}`);
                    }
                };

                const readSettings = () => {
                    const s = {};
                    sec.querySelectorAll('[data-setting]').forEach(el => {
                        if (el.type === 'checkbox') s[el.dataset.setting] = el.checked ? 1 : 0;
                        else s[el.dataset.setting] = el.value;
                    });
                    return s;
                };

                const iecStatus = sec.querySelector('.iec-status');

                const loadIECProfiles = async () => {
                    const listEl = sec.querySelector('.iec-profile-list');
                    try {
                        const profiles = await fetch('/api/iec-profiles').then(r => r.json());
                        listEl.innerHTML = '';
                        const names = Object.keys(profiles);
                        if (!names.length) {
                            listEl.innerHTML = '<div class="iec-empty">No saved profiles.</div>';
                            return;
                        }
                        names.forEach(name => {
                            const p = profiles[name];
                            const d = new Date(p.saved);
                            const row = document.createElement('div');
                            row.className = 'iec-profile-row';
                            row.innerHTML = `
                                <div class="iec-profile-info">
                                    <div class="iec-profile-name">${name}</div>
                                    <div class="iec-profile-date">${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                                </div>
                                <div class="iec-profile-btns">
                                    <button class="iec-load-btn">Load</button>
                                    <button class="iec-del-btn">✕</button>
                                </div>
                            `;
                            row.querySelector('.iec-load-btn').addEventListener('click', async () => {
                                const ip = getIp(); if (!ip) return;
                                iecStatus.textContent = `Applying "${name}"…`;
                                for (const [key, val] of Object.entries(p.settings)) {
                                    await postSetting(ip, key, val);
                                }
                                applyValsToControls(Object.fromEntries(Object.entries(p.settings).map(([k,v])=>[k,String(v)])));
                                iecStatus.textContent = `"${name}" applied.`;
                                setTimeout(() => { iecStatus.textContent = ''; }, 3000);
                            });
                            row.querySelector('.iec-del-btn').addEventListener('click', async () => {
                                await fetch(`/api/iec-profiles/${encodeURIComponent(name)}`, { method: 'DELETE' });
                                loadIECProfiles();
                            });
                            listEl.appendChild(row);
                        });
                    } catch (e) {
                        listEl.innerHTML = '<div class="iec-empty">Failed to load profiles.</div>';
                    }
                };

                sec.querySelector('.iec-save-btn').addEventListener('click', async () => {
                    const nameInput = sec.querySelector('.iec-name-input');
                    const name = nameInput.value.trim();
                    if (!name) { nameInput.style.borderColor = 'var(--error-color)'; return; }
                    nameInput.style.borderColor = '';
                    await fetch('/api/iec-profiles', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, settings: readSettings() })
                    });
                    nameInput.value = '';
                    loadIECProfiles();
                });

                sec.querySelector('.iec-apply-btn').addEventListener('click', async () => {
                    const ip = getIp(); if (!ip) return;
                    const presetInput = sec.querySelector('.iec-presets-input');
                    const presets = parsePresetRange(presetInput.value);
                    if (!presets.length) { presetInput.style.borderColor = 'var(--error-color)'; return; }
                    presetInput.style.borderColor = '';
                    const settings = readSettings();
                    for (const n of presets) {
                        iecStatus.textContent = `Applying to preset ${n}…`;
                        await cgi(ip, `/cgi-bin/ptzctrl.cgi?ptzcmd&poscall&${n}`);
                        await new Promise(r => setTimeout(r, 2000));
                        for (const [key, val] of Object.entries(settings)) {
                            await postSetting(ip, key, val);
                        }
                        await cgi(ip, `/cgi-bin/ptzctrl.cgi?ptzcmd&posset&${n}`);
                        await new Promise(r => setTimeout(r, 300));
                    }
                    iecStatus.textContent = 'Done.';
                    setTimeout(() => { iecStatus.textContent = ''; }, 3000);
                });

                // Load settings + IEC profiles when settings tab is opened
                sec.querySelectorAll('.cam-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        if (tab.dataset.tab === 'settings') {
                            loadImageSettings();
                            loadIECProfiles();
                        }
                    });
                });

                // ── Tracking wiring ────────────────────────────
                const trackToggle = sec.querySelector('.tracking-enable');
                trackToggle.checked = !!trackingActive[i];
                trackToggle.addEventListener('change', () => {
                    if (trackToggle.checked) startTracking(i);
                    else stopTracking(i);
                    saveCameras();
                });

                const ptzSpeedSlider = sec.querySelector('.ptz-speed');
                if (ptzSpeedSlider) {
                    ptzSpeedSlider.value = ptzSpeed[i] || 8;
                    ptzSpeedSlider.closest('.setting-row').querySelector('label span').textContent = ptzSpeedSlider.value;
                    let ptzSpeedSaveTimer = null;
                    ptzSpeedSlider.addEventListener('input', () => {
                        ptzSpeedSlider.closest('.setting-row').querySelector('label span').textContent = ptzSpeedSlider.value;
                        ptzSpeed[i] = +ptzSpeedSlider.value;
                        clearTimeout(ptzSpeedSaveTimer);
                        ptzSpeedSaveTimer = setTimeout(saveCameras, 500);
                    });
                }

                const speedSlider = sec.querySelector('.max-speed');
                if (speedSlider) {
                    const initialSpeed = trackingMaxSpeed[i] || 10;
                    speedSlider.value = initialSpeed;
                    trackingMaxSpeed[i] = +initialSpeed;
                    speedSlider.previousElementSibling.querySelector('span').textContent = speedSlider.value;
                    let maxSpeedSaveTimer = null;
                    speedSlider.addEventListener('input', () => {
                        speedSlider.previousElementSibling.querySelector('span').textContent = speedSlider.value;
                        trackingMaxSpeed[i] = +speedSlider.value;
                        clearTimeout(maxSpeedSaveTimer);
                        maxSpeedSaveTimer = setTimeout(saveCameras, 500);
                    });
                }

                // Restore and wire up lost-target settings
                const ts = trackingSettings[i] || {};
                if (ts.lostBehavior) {
                    const radio = sec.querySelector(`[name="lost-${i}"][value="${ts.lostBehavior}"]`);
                    if (radio) radio.checked = true;
                }
                const presetNumInput = sec.querySelector('.preset-num');
                if (presetNumInput && ts.lostPreset) presetNumInput.value = ts.lostPreset;

                sec.querySelectorAll(`[name="lost-${i}"]`).forEach(radio => {
                    radio.addEventListener('change', () => {
                        if (!trackingSettings[i]) trackingSettings[i] = {};
                        trackingSettings[i].lostBehavior = radio.value;
                        saveCameras();
                    });
                });
                if (presetNumInput) {
                    presetNumInput.addEventListener('change', () => {
                        if (!trackingSettings[i]) trackingSettings[i] = {};
                        trackingSettings[i].lostPreset = presetNumInput.value;
                        saveCameras();
                    });
                }

                // Dead zone drag wiring on the stream area
                const streamEl = sec.querySelector('.cam-stream');
                const HIT_PX = 28;

                function dzHitSide(clientX) {
                    const dz  = getDeadZone(i);
                    const lPx = normToStreamClientX(streamEl, dz.left);
                    const rPx = normToStreamClientX(streamEl, dz.right);
                    if (Math.abs(clientX - lPx) < HIT_PX) return 'left';
                    if (Math.abs(clientX - rPx) < HIT_PX) return 'right';
                    return null;
                }

                streamEl.addEventListener('mousemove', e => {
                    if (dzDrag) return;
                    const side = dzHitSide(e.clientX);
                    streamEl.style.cursor = side ? 'ew-resize' : '';
                });
                streamEl.addEventListener('mousedown', e => {
                    const side = dzHitSide(e.clientX);
                    if (side) {
                        e.stopPropagation();
                        e.preventDefault();
                        dzDrag = { slot: i, side, streamEl };
                        streamEl.style.cursor = 'ew-resize';
                    }
                });

                // Touch support
                streamEl.addEventListener('touchstart', e => {
                    const touch = e.changedTouches[0];
                    const side = dzHitSide(touch.clientX);
                    if (side) {
                        e.stopPropagation();
                        e.preventDefault();
                        dzDrag = { slot: i, side, streamEl, touchId: touch.identifier };
                    }
                }, { passive: false });
                streamEl.addEventListener('touchmove', e => {
                    if (!dzDrag || dzDrag.streamEl !== streamEl) return;
                    const touch = [...e.changedTouches].find(t => t.identifier === dzDrag.touchId);
                    if (!touch) return;
                    e.preventDefault();
                    const dz   = getDeadZone(dzDrag.slot);
                    const norm = streamClientXToNorm(streamEl, touch.clientX);
                    const MIN_WIDTH = 0.04;
                    if (dzDrag.side === 'left') {
                        dz.left = Math.max(0.01, Math.min(dz.right - MIN_WIDTH, norm));
                    } else {
                        dz.right = Math.min(0.99, Math.max(dz.left + MIN_WIDTH, norm));
                    }
                    trackingDeadZone[dzDrag.slot] = dz;
                    if (!trackingSettings[dzDrag.slot]) trackingSettings[dzDrag.slot] = {};
                    trackingSettings[dzDrag.slot].deadZone = { ...dz };
                    drawTrackingOverlay(dzDrag.slot, null, null);
                    clearTimeout(dzSaveTimer);
                    dzSaveTimer = setTimeout(saveCameras, 300);
                }, { passive: false });
                streamEl.addEventListener('touchend', e => {
                    if (!dzDrag || dzDrag.streamEl !== streamEl) return;
                    const touch = [...e.changedTouches].find(t => t.identifier === dzDrag.touchId);
                    if (touch) dzDrag = null;
                });

                // Restore dead zone from saved settings
                if (trackingSettings[i] && trackingSettings[i].deadZone) {
                    trackingDeadZone[i] = trackingSettings[i].deadZone;
                }

                // Restore previously assigned camera stream
                const restoredCamId = currentLayout === 1 ? stagingCamera : sectionCameras[i];
                if (restoredCamId) {
                    const cam = cameras.find(c => c.id === restoredCamId);
                    if (cam) startSnapshot(cam.ip, sec.querySelector('img'), i);
                }

                main.appendChild(sec);
                sectionObserver.observe(sec);
            }
        }


        // ── Sidebar toggle ─────────────────────────────────────
        document.getElementById('sidebar-collapse-btn').addEventListener('click', () => {
            document.body.classList.add('sidebar-collapsed');
        });
        document.getElementById('sidebar-expand-tab').addEventListener('click', () => {
            document.body.classList.remove('sidebar-collapsed');
        });

        // ── Init ───────────────────────────────────────────────
        // sectionObserver is defined inside renderSections scope — hoist call after DOM ready
        renderSections();
        loadCameras();

        fetch('/api/local-subnet').then(r => r.json()).then(({ subnet }) => {
            if (subnet) document.getElementById('input-ip').placeholder = `e.g. ${subnet}.100`;
        }).catch(() => {});

        // ── Render ─────────────────────────────────────────────
        function renderList() {
            const list = document.getElementById('camera-list');
            list.innerHTML = '';

            cameras.forEach((cam, index) => {
                const item = document.createElement('div');
                item.className = 'camera-item' + (cam.id === activeCamera ? ' active' : '');
                item.dataset.id = cam.id;
                item.draggable  = true;

                item.innerHTML = `
                    <span class="drag-handle" title="Drag to reorder">⠿</span>
                    <div class="camera-thumb">
                        <span class="camera-delete" title="Remove camera">✕</span>
                        <img alt="" style="display:none">
                        <div class="no-feed">No feed</div>
                    </div>
                    <div class="camera-name" title="${cam.name}">${cam.name}</div>
                    <div class="camera-ip" title="${cam.ip}">${cam.ip}</div>
                `;

                // Single snapshot for thumbnail — no live polling
                const thumbImg = item.querySelector('.camera-thumb img');
                const noFeedEl = item.querySelector('.no-feed');
                thumbImg.onload = () => { thumbImg.style.display = 'block'; noFeedEl.style.display = 'none'; };
                thumbImg.src = `/api/snapshot/${cam.ip}?t=${Date.now()}`;

                item.querySelector('.camera-delete').addEventListener('click', e => {
                    e.stopPropagation();
                    removeCamera(cam.id);
                });

                item.addEventListener('click', e => {
                    if (e.target.classList.contains('drag-handle')) return;
                    if (selectedSlot !== null) {
                        assignCameraToSlot(cam.id, selectedSlot);
                    } else if (currentLayout === 1) {
                        assignCameraToSlot(cam.id, 0);
                    } else {
                        setActive(cam.id);
                    }
                });

                item.addEventListener('dragstart', e => {
                    dragSrcIndex = index;
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });
                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    dragOverIndex = null;
                    document.querySelectorAll('.camera-item').forEach(el => el.classList.remove('drag-over'));
                });
                item.addEventListener('dragover', e => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    if (index !== dragSrcIndex) {
                        // Only update classes if the hovered item changed
                        if (dragOverIndex !== index) {
                            if (dragOverIndex !== null) {
                                const prev = list.querySelector(`.camera-item[data-id]`);
                                // remove drag-over from previous
                                list.querySelectorAll('.camera-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                            }
                            dragOverIndex = index;
                            item.classList.add('drag-over');
                        }
                    }
                });
                item.addEventListener('drop', e => {
                    e.preventDefault();
                    if (dragSrcIndex === null || dragSrcIndex === index) return;
                    const moved = cameras.splice(dragSrcIndex, 1)[0];
                    cameras.splice(index, 0, moved);
                    dragSrcIndex = null;
                    dragOverIndex = null;
                    renderList();
                    saveCameras();
                });

                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
