<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Management Platform</title>
    <style>
        :root {
            --text-color: #A9B1BC;
            --text-color-dark: #7c8188;
            --main-color: #3066be;
            --main-color-l: #4b82db;
            --body-color: #212121;
            --dark-color: #1b1b1f;
            --popup-color: #383838;
            --button-color: #3e3e3e;
            --button-color-light: #4a4a4a;
            --side-bar-color: #212125;
            --sidebar-width: 160px;
            --error-color: #E11D62;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--dark-color);
            color: var(--text-color);
            font-family: sans-serif;
            font-size: 14px;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        button {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-app-region: no-drag;
        }

        button.pressed {
            background: var(--main-color) !important;
            color: #fff !important;
        }

        /* ── Sidebar ─────────────────────────────────────────── */
        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--side-bar-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            border-right: 1px solid #2e2e32;
        }

        body.sidebar-collapsed #sidebar {
            width: 0;
            min-width: 0;
            border-right: none;
        }

        #sidebar-top {
            padding: 10px 8px 8px;
            border-bottom: 1px solid #2e2e32;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #add-camera-btn { flex: 1; }

        #sidebar-collapse-btn {
            flex-shrink: 0;
            background: none;
            border: 1px solid #3a3a3e;
            border-radius: 4px;
            color: var(--text-color-dark);
            cursor: pointer;
            padding: 4px 7px;
            font-size: 13px;
            line-height: 1;
            font-family: inherit;
        }

        #sidebar-collapse-btn:hover { color: var(--text-color); background: var(--button-color); }

        #sidebar-expand-tab {
            display: none;
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--side-bar-color);
            border: 1px solid #2e2e32;
            border-left: none;
            border-radius: 0 4px 4px 0;
            color: var(--text-color);
            cursor: pointer;
            padding: 10px 5px;
            font-size: 13px;
            line-height: 1;
            z-index: 50;
        }

        #sidebar-expand-tab:hover { background: var(--button-color); }

        body.sidebar-collapsed #sidebar-expand-tab { display: block; }

        #add-camera-btn {
            width: 100%;
            padding: 7px 0;
            background: var(--main-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }

        #add-camera-btn:hover {
            background: var(--main-color-l);
        }

        /* ── Camera list ─────────────────────────────────────── */
        #camera-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 0;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        #camera-list::-webkit-scrollbar { width: 6px; }
        #camera-list::-webkit-scrollbar-track { background: transparent; }
        #camera-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .camera-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 6px;
            cursor: pointer;
            border-left: 3px solid transparent;
            user-select: none;
            position: relative;
        }

        .camera-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .camera-item.active {
            border-left-color: var(--main-color);
            background: rgba(48, 102, 190, 0.12);
        }

        .camera-item.drag-over {
            border-top: 2px solid var(--main-color);
        }

        .camera-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            margin-bottom: 5px;
        }

        .camera-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .camera-thumb .no-feed {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color-dark);
            font-size: 11px;
        }

        .camera-name {
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .camera-ip {
            font-size: 10px;
            color: var(--text-color-dark);
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Remove-from-slot button (shown on stream hover) ── */
        .slot-remove-btn {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(225, 29, 98, 0.85);
            color: #fff;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            z-index: 10;
            user-select: none;
            border: none;
        }

        .cam-stream:hover .slot-remove-btn {
            opacity: 1;
        }

        /* drag handle — shown on hover */
        .drag-handle {
            position: absolute;
            top: 6px;
            right: 4px;
            cursor: grab;
            opacity: 0;
            color: var(--text-color-dark);
            font-size: 12px;
            line-height: 1;
        }

        .camera-item:hover .drag-handle {
            opacity: 1;
        }

        .camera-item.dragging {
            opacity: 0.4;
        }

        /* ── Add camera modal ────────────────────────────────── */
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        #modal-overlay.open {
            display: flex;
        }

        #modal {
            background: var(--popup-color);
            border-radius: 6px;
            padding: 20px;
            width: 340px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        #modal h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #fff;
        }

        /* tabs */
        .modal-tabs {
            display: flex;
            margin-bottom: 16px;
            border-bottom: 1px solid #444;
        }

        .modal-tab {
            flex: 1;
            padding: 7px 0;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-color-dark);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            user-select: none;
        }

        .modal-tab.active {
            color: var(--main-color-l);
            border-bottom-color: var(--main-color-l);
        }

        .modal-pane { display: none; }
        .modal-pane.active { display: block; }

        #modal label {
            display: block;
            font-size: 12px;
            color: var(--text-color-dark);
            margin-bottom: 4px;
        }

        #modal input[type="text"] {
            width: 100%;
            padding: 7px 9px;
            background: var(--dark-color);
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--text-color);
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.15s;
        }

        #modal input[type="text"]:focus {
            border-color: var(--main-color);
        }

        #modal-error {
            font-size: 12px;
            color: var(--error-color);
            min-height: 16px;
            margin-bottom: 8px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .modal-buttons button {
            padding: 7px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }

        #modal-cancel {
            background: var(--button-color);
            color: var(--text-color);
        }

        #modal-cancel:hover {
            background: var(--button-color-light);
        }

        #modal-add {
            background: var(--main-color);
            color: #fff;
        }

        #modal-add:hover {
            background: var(--main-color-l);
        }

        /* scan tab */
        #scan-btn {
            width: 100%;
            padding: 8px 0;
            background: var(--button-color);
            color: var(--text-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 12px;
        }

        #scan-btn:hover:not(:disabled) { background: var(--button-color-light); }
        #scan-btn:disabled { opacity: 0.5; cursor: default; }

        #scan-status {
            font-size: 12px;
            color: var(--text-color-dark);
            min-height: 16px;
            margin-bottom: 8px;
        }

        #scan-results {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        #scan-results::-webkit-scrollbar { width: 5px; }
        #scan-results::-webkit-scrollbar-track { background: transparent; }
        #scan-results::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .scan-result-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .scan-result-item:hover { background: rgba(255,255,255,0.06); }

        .scan-result-item.selected { background: rgba(48,102,190,0.2); }

        .scan-result-ip {
            flex: 1;
            color: var(--text-color);
            font-family: monospace;
        }

        .scan-result-label {
            font-size: 11px;
            color: var(--text-color-dark);
        }

        /* delete button on thumbnail */
        .camera-delete {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(225, 29, 98, 0.85);
            color: #fff;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            z-index: 2;
        }

        .camera-item:hover .camera-delete {
            opacity: 1;
        }

        /* name-prompt pane */
        #pane-name-prompt { }

        #name-prompt-error {
            font-size: 12px;
            color: var(--error-color);
            min-height: 16px;
            margin-bottom: 8px;
        }

        /* ── Layout switcher ─────────────────────────────────── */
        #layout-switcher {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 6px;
            border-top: 1px solid #2e2e32;
        }

        .layout-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            color: var(--text-color-dark);
            line-height: 0;
        }

        .layout-btn:hover {
            color: var(--text-color);
            background: rgba(255,255,255,0.06);
        }

        .layout-btn.active {
            color: var(--main-color-l);
            background: rgba(48,102,190,0.15);
        }

        .layout-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }

        /* ── Main area ───────────────────────────────────────── */
        #main {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            height: 100vh;
        }

        .cam-section {
            display: flex;
            flex-direction: row;   /* overridden by .tall via ResizeObserver */
            border: 1px solid #2e2e32;
            box-sizing: border-box;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            contain: layout style;
        }

        .cam-section.selected {
            border-color: var(--main-color-l);
            box-shadow: inset 0 0 0 1px var(--main-color-l);
        }

        /* sidebar hint when a section is selected */
        #camera-list.assigning .camera-item {
            cursor: crosshair;
        }

        #camera-list.assigning .camera-item:hover {
            background: rgba(48,102,190,0.15);
        }

        #assign-hint {
            padding: 6px 8px;
            font-size: 11px;
            color: var(--main-color-l);
            text-align: center;
            display: none;
        }

        #assign-hint.visible { display: block; }

        /* ── Empty section ───────────────────────────────────── */
        .cam-section.no-camera .cam-controls { display: none; }
        .cam-section.no-camera .cam-stream { display: none; }

        .no-cam-hint {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            color: var(--text-color-dark);
            font-size: 13px;
        }
        .cam-section.no-camera .no-cam-hint { display: flex; }

        /* ── Stream area ─────────────────────────────────────── */
        .cam-stream {
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .tracking-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            will-change: contents;
        }

        .cam-stream img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            will-change: transform;
        }

        .cam-section.wide { flex-direction: row; }
        .cam-section.tall { flex-direction: column; }

        /* wide: stream fills height, 16:9 width, max 65% of section */
        .cam-section.wide .cam-stream {
            height: 100%;
            aspect-ratio: 16 / 9;
            max-width: 65%;
            width: auto;
        }

        /* tall: stream fills width, 16:9 height, max 55% of section height */
        .cam-section.tall .cam-stream {
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 55%;
            height: auto;
        }

        /* ── Controls panel ──────────────────────────────────── */
        .cam-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ── Tab bar ─────────────────────────────────────────── */
        .cam-tabs {
            display: flex;
            flex-shrink: 0;
            border-bottom: 1px solid #2e2e32;
        }

        .cam-tab {
            flex: 1;
            padding: 8px 4px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-color-dark);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            user-select: none;
            white-space: nowrap;
        }

        .cam-tab:hover { color: var(--text-color); }

        .cam-tab.active {
            color: var(--main-color-l);
            border-bottom-color: var(--main-color-l);
        }

        /* ── Tab content ─────────────────────────────────────── */
        .cam-tab-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .cam-tab-content::-webkit-scrollbar { width: 5px; }
        .cam-tab-content::-webkit-scrollbar-track { background: transparent; }
        .cam-tab-content::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .tab-pane {
            display: none;
            padding: 12px;
            color: var(--text-color-dark);
            font-size: 13px;
        }

        .tab-pane.active { display: block; }

        /* ── PTZ tab ─────────────────────────────────────────── */
        .ptz-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            font-size: 12px;
        }

        .ptz-main {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 34px);
            grid-template-rows: repeat(3, 34px);
            grid-template-areas:
                ". up ."
                "left home right"
                ". down .";
            gap: 2px;
        }

        .dpad button {
            width: 34px;
            height: 34px;
            background: var(--button-color);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;   /* dpad only: must block scroll for hold-move */
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-app-region: no-drag;
            -ms-touch-action: none;
        }

        .dpad button {
            pointer-events: auto;
            transition: none !important;
        }
        .dpad button:hover { background: var(--button-color-light); }
        .dpad button:focus { outline: none !important; box-shadow: none !important; }
        .dpad button:focus-visible { outline: none !important; }
        .dpad button:active { background: var(--button-color) !important; }
        .dpad button.pressed {
            opacity: 0.6 !important;
            outline: none !important;
        }

        .dpad button { font-size: 26px; line-height: 1; }
        .dpad button.home { font-size: inherit; display: flex; align-items: center; justify-content: center; }
        .dpad button[data-ptz="up"]    { grid-area: up; }
        .dpad button[data-ptz="left"]  { grid-area: left; }
        .dpad button[data-ptz="home"]  { grid-area: home; }
        .dpad button[data-ptz="right"] { grid-area: right; }
        .dpad button[data-ptz="down"]  { grid-area: down; }

        .zoom-slider, .focus-slider {
            flex: 1;
            cursor: pointer;
            accent-color: var(--main-color);
        }

        .nudge-btn {
            flex-shrink: 0;
            padding: 0 5px;
            height: 22px;
            background: var(--button-color);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            font-family: inherit;
        }
        .nudge-btn:hover  { background: var(--button-color-light); }
        .nudge-btn:active { background: var(--main-color); color: #fff; }

        .af-btn {
            flex-shrink: 0;
            width: 34px;
            height: 26px;
            background: var(--button-color);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
        }
        .af-btn:hover { background: var(--button-color-light); }
        .af-btn.af-on { background: var(--main-color); color: #fff; }

        .zf-label {
            font-size: 10px;
            color: var(--text-color-dark);
            text-align: center;
            margin-top: 4px;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .preset-btn {
            padding: 4px 2px;
            min-height: 36px;
            height: auto;
            background: var(--button-color);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 22px;
            font-family: inherit;
            transition: background 0.1s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-app-region: no-drag;
            -ms-touch-action: none;
        }

        .preset-btn:hover { background: var(--button-color-light); }
        .preset-btn:active { background: var(--main-color); color: #fff; }
        .preset-btn.pressed { background: var(--main-color); color: #fff; }
        .preset-btn.holding { background: var(--main-color); color: #fff; }

        .preset-confirm {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: var(--popup-color);
            border-radius: 4px;
            padding: 10px;
            margin-top: 6px;
        }

        .preset-confirm.visible { display: flex; }

        .preset-confirm-label {
            font-size: 12px;
            color: var(--text-color);
        }

        .preset-confirm input[type="text"] {
            width: 100%;
            padding: 5px 8px;
            background: var(--dark-color);
            border: 1px solid #444;
            border-radius: 3px;
            color: var(--text-color);
            font-size: 12px;
            font-family: inherit;
        }

        .preset-confirm-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .preset-confirm-btns button {
            padding: 4px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .preset-confirm-cancel { background: var(--button-color); color: var(--text-color); }
        .preset-confirm-ok     { background: var(--main-color);   color: #fff; }

        .ptz-label {
            font-size: 10px;
            color: var(--text-color-dark);
            margin-bottom: 2px;
        }

        /* ── Settings tab ────────────────────────────────────── */
        .settings-inner-tabs {
            display: flex;
            flex-shrink: 0;
            border-bottom: 1px solid #2e2e32;
        }

        .settings-inner-tab {
            flex: 1;
            padding: 6px 4px;
            text-align: center;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-color-dark);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
            user-select: none;
        }

        .settings-inner-tab.active {
            color: var(--main-color-l);
            border-bottom-color: var(--main-color-l);
        }

        .settings-inner-pane {
            display: none;
            padding: 8px 10px;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }

        .settings-inner-pane.active { display: flex; }

        .setting-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }

        .setting-row label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-color);
            font-size: 12px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .setting-row label span {
            color: var(--main-color-l);
            min-width: 20px;
            text-align: right;
        }

        .setting-row input[type="range"] {
            flex: 1;

<body>

    <button id="sidebar-expand-tab" title="Open sidebar">›</button>

    <!-- Sidebar -->
    <aside id="sidebar">
        <div id="sidebar-top">
            <button id="add-camera-btn">+ Add Camera</button>
            <button id="sidebar-collapse-btn" title="Collapse sidebar">‹</button>
        </div>
        <div id="assign-hint">Click a camera to assign</div>
        <div id="camera-list">
            <!-- Camera items injected here -->
        </div>
        <div id="layout-switcher">
            <!-- 1: single box -->
            <button class="layout-btn active" data-layout="1" title="Single">
                <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="2" y="2" width="18" height="18" rx="1"/>
                </svg>
            </button>
            <!-- 2: two vertical columns -->
            <button class="layout-btn" data-layout="2" title="Two columns">
                <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="2" y="2" width="18" height="18" rx="1"/>
                    <line x1="11" y1="2" x2="11" y2="20"/>
                </svg>
            </button>
            <!-- 3: three vertical columns -->
            <button class="layout-btn" data-layout="3" title="Three columns">
                <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="2" y="2" width="18" height="18" rx="1"/>
                    <line x1="8" y1="2" x2="8" y2="20"/>
                    <line x1="14" y1="2" x2="14" y2="20"/>
                </svg>
            </button>
            <!-- 4: 2×2 grid -->
            <button class="layout-btn" data-layout="4" title="2×2 grid">
                <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="2" y="2" width="18" height="18" rx="1"/>
                    <line x1="11" y1="2" x2="11" y2="20"/>
                    <line x1="2" y1="11" x2="20" y2="11"/>
                </svg>
            </button>
        </div>
    </aside>

    <!-- Main content area -->
    <main id="main" class="layout-1">
        <!-- Camera sections injected here -->
    </main>

    <!-- Add Camera Modal -->
    <div id="modal-overlay">
        <div id="modal">
            <h2>Add Camera</h2>

            <div class="modal-tabs">
                <div class="modal-tab active" data-tab="manual">Enter IP</div>
                <div class="modal-tab" data-tab="scan">Search Network</div>
            </div>

            <!-- Manual entry pane -->
            <div class="modal-pane active" id="pane-manual">
                <label for="input-name">Camera Name</label>
                <input type="text" id="input-name" placeholder="e.g. Stage Left">
                <label for="input-ip">IP Address</label>
                <input type="text" id="input-ip" placeholder="e.g. 192.168.1.100" autocomplete="off">
                <div id="modal-error"></div>
                <div class="modal-buttons">
                    <button id="modal-cancel">Cancel</button>
                    <button id="modal-add">Add</button>
                </div>
            </div>

            <!-- Scan pane -->
            <div class="modal-pane" id="pane-scan">
                <button id="scan-btn">Scan Network</button>
                <div id="scan-status"></div>
                <div id="scan-results"></div>
                <div class="modal-buttons">
                    <button id="scan-cancel">Cancel</button>
                    <button id="scan-add" disabled>Add Selected</button>
                </div>
            </div>

            <!-- Name prompt pane (shown after selecting from scan) -->
            <div class="modal-pane" id="pane-name-prompt">
                <label for="input-scan-name">Camera Name</label>
                <input type="text" id="input-scan-name" placeholder="e.g. Stage Left">
                <div id="name-prompt-error"></div>
                <div class="modal-buttons">
                    <button id="name-prompt-back">Back</button>
                    <button id="name-prompt-confirm">Add</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ── WebSocket Tracking (gotracker) ──────────────────────
        let ws = null;
        let lastDir = '';

        function connectWS() {
            const url = `ws://${location.host}/ws`;
            ws = new WebSocket(url);
            ws.onopen = () => { console.log('[WS] Connected'); };
            ws.onmessage = (evt) => {
                try {
                    const msg = JSON.parse(evt.data);
                    handlePoseMessage(msg);
                } catch (e) {
                    console.warn('WS parse error:', e, 'data:', evt.data.substring(0, 50));
                }
            };
            ws.onclose = () => { console.log('WS closed, reconnecting...'); setTimeout(connectWS, 2000); };
            ws.onerror = (e) => { console.error('WS error:', e); ws.close(); };
        }
        connectWS();

        // Cached once — was being rebuilt as an array with O(n) .includes() on every WS frame
        const FACE_KP_SET = new Set(['left_ear','left_eye','nose','right_eye','right_ear']);

        function handlePoseMessage(data) {
            const slot = 0;
            const ip = getSlotIp ? getSlotIp(slot) : null;
            if (data.cmd === 'notfound') {
                if (trackingActive[slot] && !trackingLost[slot]) {
                    trackingLost[slot] = true;
                    const settings = trackingSettings[slot] || {};
                    const behavior = settings.lostBehavior || 'stop';
                    if (behavior === 'preset') {
                        const presetNum = settings.lostPreset || 1;
                        if (ip) cgi(ip, `/cgi-bin/ptzctrl.cgi?ptzcmd&preset&call&${presetNum}`);
                    } else if (behavior === 'stop') {
                        if (ip) cgi(ip, '/cgi-bin/ptzctrl.cgi?ptzcmd&ptzstop');
                    }
                }
                return;
            }
            if (!data.keypoints || data.keypoints.length === 0) return;
            trackingLost[slot] = false;

            if (!ip || !trackingActive[slot]) {
                return;
            }

            // Always draw the overlay with the pose data
            drawTrackingOverlay(slot, data.keypoints, data.box);

            const faceKps = data.keypoints.filter(k => FACE_KP_SET.has(k.name));
            const used = faceKps.length >= 2 ? faceKps : data.keypoints;
            const cx = used.length > 0 ? used.reduce((s,k) => s + k.x, 0) / used.length : 0.5;

            const dz = getDeadZone(slot);
            let dir = '';
            if      (cx > dz.right) dir = 'right';
            else if (cx < dz.left)  dir = 'left';

            if (!dir) {
                if (lastDir !== '') {
                    lastDir = '';
                    cgi(ip, '/cgi-bin/ptzctrl.cgi?ptzcmd&ptzstop');
                }
            } else {
                const vx = Math.max(1, +trackingMaxSpeed[slot] || 10);
                if (dir !== lastDir) {
                    lastDir = dir;
                    cgi(ip, `/cgi-bin/ptzctrl.cgi?ptzcmd&${dir}&${vx}&${vx}`);
                }
            }
        }

        // ── State ──────────────────────────────────────────────
        let cameras      = [];   // [{ id, name, ip }]
        let activeCamera = null;
        let dragSrcIndex = null;
        let dragOverIndex = null;

        // ── Modal shared ───────────────────────────────────────
        const overlay = document.getElementById('modal-overlay');

        document.getElementById('add-camera-btn').onclick = () => openModal();
        overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeModal(); clearSlotSelection(); }
        });

        // Tab switching
        document.querySelectorAll('.modal-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('pane-' + tab.dataset.tab).classList.add('active');
            });
        });

        function openModal() {
            // reset manual pane
            document.getElementById('input-name').value = '';
            document.getElementById('input-ip').value   = '';
            document.getElementById('modal-error').textContent = '';
            // reset scan pane
            document.getElementById('scan-status').textContent = '';
            document.getElementById('scan-results').innerHTML  = '';
            document.getElementById('scan-add').disabled = true;
            scanSelected = null;
            // show manual tab by default
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));
            document.querySelector('.modal-tab[data-tab="manual"]').classList.add('active');
            document.getElementById('pane-manual').classList.add('active');

            overlay.classList.add('open');
            document.getElementById('input-name').focus();
        }

        function closeModal() {
            overlay.classList.remove('open');
            if (scanAbort) { scanAbort(); scanAbort = null; }
        }

        // ── Manual entry ───────────────────────────────────────
        document.getElementById('modal-cancel').onclick = () => closeModal();
        document.getElementById('modal-add').onclick    = () => submitManual();
        document.getElementById('pane-manual').addEventListener('keydown', e => {
            if (e.key === 'Enter') submitManual();
        });

        function submitManual() {
            const name = document.getElementById('input-name').value.trim();
            const ip   = document.getElementById('input-ip').value.trim();
            const err  = document.getElementById('modal-error');

            if (!name)           { err.textContent = 'Camera name is required.'; return; }
            if (!ip)             { err.textContent = 'IP address is required.'; return; }
            if (!isValidIp(ip))  { err.textContent = 'Enter a valid IP address.'; return; }
            if (cameras.some(c => c.ip === ip)) { err.textContent = `A camera with IP ${ip} already exists.`; return; }

            addCamera(name, ip);
            closeModal();
        }

        // ── Scan ───────────────────────────────────────────────
        let scanSelected = null;
        let scanAbort    = null;

        document.getElementById('scan-cancel').onclick = () => closeModal();
        document.getElementById('scan-btn').onclick    = () => startScan();
        document.getElementById('scan-add').onclick    = () => {
            if (!scanSelected) return;
            showNamePrompt(scanSelected);
        };

        // ── Name prompt (post-scan) ────────────────────────────
        document.getElementById('name-prompt-back').onclick = () => showPane('scan');
        document.getElementById('name-prompt-confirm').onclick = () => confirmScanAdd();
        document.getElementById('pane-name-prompt').addEventListener('keydown', e => {
            if (e.key === 'Enter') confirmScanAdd();
        });

        function showNamePrompt(cam) {
            const input = document.getElementById('input-scan-name');
            input.value = cam.name || cam.ip;
            document.getElementById('name-prompt-error').textContent = '';
            showPane('name-prompt');
            input.select();
        }

        function confirmScanAdd() {
            const name = document.getElementById('input-scan-name').value.trim();
            const nameErr = document.getElementById('name-prompt-error');
            if (!name) { nameErr.textContent = 'Name is required.'; return; }
            if (cameras.some(c => c.ip === scanSelected.ip)) { nameErr.textContent = `A camera with IP ${scanSelected.ip} already exists.`; return; }
            addCamera(name, scanSelected.ip);
            closeModal();
        }

        function showPane(id) {
            document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));
            document.getElementById('pane-' + id).classList.add('active');
        }

        async function startScan() {
            const btn     = document.getElementById('scan-btn');
            const status  = document.getElementById('scan-status');
            const results = document.getElementById('scan-results');

            btn.disabled = true;
            btn.textContent = 'Scanning…';
            status.textContent = 'Looking for cameras on your network…';
            results.innerHTML  = '';
            scanSelected = null;
            document.getElementById('scan-add').disabled = true;

            let aborted = false;
            scanAbort = () => { aborted = true; };

            try {
                const res  = await fetch('/api/scan');
                const data = await res.json();

                if (aborted) return;

                if (!data.cameras || data.cameras.length === 0) {
                    status.textContent = 'No cameras found on the network.';
                } else {
                    status.textContent = `Found ${data.cameras.length} camera${data.cameras.length > 1 ? 's' : ''}`;
                    data.cameras.forEach(cam => {
                        const item = document.createElement('div');
                        item.className = 'scan-result-item';
                        item.innerHTML = `
                            <span class="scan-result-ip">${cam.ip}</span>
                            <span class="scan-result-label">${cam.name || 'PTZOptics'}</span>
                        `;
                        item.addEventListener('click', () => {
                            document.querySelectorAll('.scan-result-item').forEach(el => el.classList.remove('selected'));
                            item.classList.add('selected');
                            scanSelected = cam;
                            document.getElementById('scan-add').disabled = false;
                        });
                        results.appendChild(item);
                    });
                }
            } catch (err) {
                if (!aborted) status.textContent = 'Scan failed. Is the server running?';
            } finally {
                if (!aborted) {
                    btn.disabled = false;
                    btn.textContent = 'Scan Again';
                }
            }
        }

        // ── Helpers ────────────────────────────────────────────
        function isValidIp(val) {
            return /^(\d{1,3}\.){3}\d{1,3}$/.test(val) &&
                val.split('.').every(n => +n >= 0 && +n <= 255);
        }

        // ── Persistence ────────────────────────────────────────
        async function loadCameras() {
            try {
                const res  = await fetch('/api/cameras');
                const data = await res.json();
                cameras = data.cameras || [];

                if (data.layout) {
                    currentLayout = data.layout;
                    document.getElementById('main').className = `layout-${currentLayout}`;
                    document.querySelectorAll('.layout-btn').forEach(btn => {
                        btn.classList.toggle('active', +btn.dataset.layout === currentLayout);
                    });
                }

                if (data.sections) {
                    Object.entries(data.sections).forEach(([slot, camId]) => {
                        sectionCameras[+slot] = camId;
                    });
                }

                if (data.stagingCamera) stagingCamera = data.stagingCamera;

                const toIntKeys = obj => Object.fromEntries(Object.entries(obj).map(([k, v]) => [+k, v]));

                if (data.presetNames) presetNames = data.presetNames;
                if (data.trackingMaxSpeed) {
                    const numKeys = Object.fromEntries(Object.entries(data.trackingMaxSpeed).map(([k, v]) => [+k, +v]));
                    Object.assign(trackingMaxSpeed, numKeys);
                }
                if (data.trackingActive) Object.assign(trackingActive, toIntKeys(data.trackingActive));
                if (data.trackingSettings) Object.assign(trackingSettings, toIntKeys(data.trackingSettings));
                if (data.ptzSpeed)         Object.assign(ptzSpeed,         toIntKeys(data.ptzSpeed));
                if (data.afState)          Object.assign(afState,          toIntKeys(data.afState));
                if (data.zoomPosition)     Object.assign(zoomPosition,     toIntKeys(data.zoomPosition));
                if (data.focusPosition)    Object.assign(focusPosition,    toIntKeys(data.focusPosition));

                if (cameras.length) {
                    activeCamera = cameras[0].id;
                    renderList();

                    // Auto-configure backend with first camera on load
                    const firstCam = cameras[0];
                    if (firstCam && firstCam.ip) {
                        fetch('/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ cameraUrl: `http://${firstCam.ip}/snapshot.jpg`, cameraIp: firstCam.ip })
                        }).catch(e => console.warn('[Config] Failed to auto-set camera on load:', e));
                    }
                }

                // renderSections already called on init — re-render now that we have state
                renderSections();
            } catch (err) {
                console.warn('Could not load cameras:', err);
            }
        }

        function saveCameras() {
            fetch('/api/cameras', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cameras, layout: currentLayout, sections: sectionCameras, stagingCamera, presetNames, trackingActive, trackingMaxSpeed, trackingSettings, ptzSpeed, afState, zoomPosition, focusPosition })
            }).catch(err => console.warn('Could not save cameras:', err));
        }

        // ── Camera management ──────────────────────────────────
        function addCamera(name, ip) {
            const cam = { id: Date.now(), name, ip };
            cameras.push(cam);
            renderList();
            setActive(cam.id);
            saveCameras();
        }

        function removeCamera(id) {
            cameras = cameras.filter(c => c.id !== id);
            if (activeCamera === id) activeCamera = cameras.length ? cameras[0].id : null;
            renderList();
            saveCameras();
        }

        function removeCameraFromSlot(slot) {
            stopSnapshot(slot);
            stopTracking(slot);
            if (currentLayout === 1) {
                stagingCamera = null;
                saveCameras();
            } else {
                delete sectionCameras[slot];
                saveCameras();
            }
            const sec = document.querySelector(`.cam-section[data-slot="${slot}"]`);
            if (sec) {
                sec.classList.add('no-camera');
                const img = sec.querySelector('img');
                if (img) { img.src = ''; img.style.display = 'none'; }
            }
        }

        function setActive(id) {
            activeCamera = id;
            document.querySelectorAll('.camera-item').forEach(el => {
                el.classList.toggle('active', +el.dataset.id === id);
            });
        }

        // ── Layout ─────────────────────────────────────────────
        let currentLayout = 1;
        let stagingCamera = null; // used only in 1-slot view, never saved

        // Flip section orientation based on its own dimensions
        const sectionObserver = new ResizeObserver(entries => {
            for (const entry of entries) {
                const { width, height } = entry.contentRect;
                entry.target.classList.toggle('wide', width >= height);
                entry.target.classList.toggle('tall', height > width);
            }
        });

        // ── Global helpers ─────────────────────────────────────
        function cgi(ip, path) {
            return fetch(`/api/cgi/${ip}?q=${encodeURIComponent(path)}`).catch(() => {});
        }

        // ── Movement watchdog ──────────────────────────────────
        // Tracks what's currently moving so we can stop it if focus is lost.
        let activeMove = null;     // { ip, cmd: 'ptzstop' | 'zoomstop' | 'focusstop' }
        let activeInterval = null; // repeat-send interval for current move

        // emergencyStop is the last-resort safety net for cases where the
        // normal pointerup/pointercancel on the button didn't fire — e.g. the
        // browser tab was backgrounded or the window lost focus.
        // We deliberately do NOT attach it to mouseup/touchend/pointerup on
        // document; those events would race with the per-button stop() and
        // cause the camera to receive stop→start→stop in rapid succession.
        function emergencyStop() {
            if (activeInterval) { clearInterval(activeInterval); activeInterval = null; }
            if (!activeMove) return;
            const { ip, cmd } = activeMove;
            activeMove = null;
            const stopCmd = `/api/cgi/${ip}?q=${encodeURIComponent(`/cgi-bin/ptzctrl.cgi?ptzcmd&${cmd}`)}`;
            fetch(stopCmd, { keepalive: true }).catch(() => {});
        }

        window.addEventListener('blur',            emergencyStop);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') emergencyStop();
        });
        window.addEventListener('beforeunload', emergencyStop);

        document.addEventListener('contextmenu', e => {
            if (e.target.closest('button')) e.preventDefault();
        });

        function parsePresetRange(str) {
            const nums = new Set();
            str.split(',').forEach(part => {
                part = part.trim();
                const range = part.match(/^(\d+)-(\d+)$/);
                if (range) {
                    const a = +range[1], b = +range[2];
                    for (let n = Math.min(a, b); n <= Math.max(a, b); n++) nums.add(n);
                } else if (/^\d+$/.test(part)) {
                    nums.add(+part);
                }
            });
            return [...nums].sort((a, b) => a - b);
        }

        function getSlotIp(slot) {
            const camId = currentLayout === 1 ? stagingCamera : sectionCameras[slot];
            const cam = cameras.find(c => c.id === camId);
            return cam ? cam.ip : null;
        }

        // ── Face tracking state ────────────────────────────────
        const trackingActive   = {};   // slot → boolean
        const trackingMaxSpeed = {};   // slot → number
        const ptzSpeed         = {};   // slot → number (1–24, default 8)
        const trackingLost     = {};   // slot → boolean (true = lost action already fired)
        const trackingSettings = {};   // slot → { lostBehavior, lostPreset }
        const trackingDeadZone = {};   // slot → { left, right } normalized 0-1
        const afState          = {};   // slot → boolean (true = AF on)
        const zoomPosition     = {};   // slot → number (0–16384)
        const focusPosition    = {};   // slot → number (0–16384)

        function getDeadZone(slot) {
            if (!trackingDeadZone[slot]) trackingDeadZone[slot] = { left: 0.46, right: 0.54 };
            return trackingDeadZone[slot];
        }

        // Convert client X on a cam-stream element to normalized image coordinate
        function streamClientXToNorm(streamEl, clientX) {
            const rect  = streamEl.getBoundingClientRect();
            const img   = streamEl.querySelector('img');
            const CW    = streamEl.clientWidth;
            const CH    = streamEl.clientHeight;
            const natW  = img.naturalWidth  || 1920;
            const natH  = img.naturalHeight || 1080;
            const scale = Math.min(CW / natW, CH / natH);
            const rendW = natW * scale;
            const offX  = (CW - rendW) / 2;
            return ((clientX - rect.left) - offX) / rendW;
        }

        // Convert normalized image coordinate to client X on a cam-stream element
        function normToStreamClientX(streamEl, norm) {
            const rect  = streamEl.getBoundingClientRect();
            const img   = streamEl.querySelector('img');
            const CW    = streamEl.clientWidth;
            const CH    = streamEl.clientHeight;
            const natW  = img.naturalWidth  || 1920;
            const natH  = img.naturalHeight || 1080;
            const scale = Math.min(CW / natW, CH / natH);
            const rendW = natW * scale;
            const offX  = (CW - rendW) / 2;
            return rect.left + offX + norm * rendW;
        }

        // Global dead zone drag state
        let dzDrag = null; // { slot, side, streamEl }

        let dzSaveTimer = null;
        document.addEventListener('mousemove', e => {
            if (!dzDrag) return;
            const dz   = getDeadZone(dzDrag.slot);
            const norm = streamClientXToNorm(dzDrag.streamEl, e.clientX);
            const MIN_WIDTH = 0.04;
            if (dzDrag.side === 'left') {
                dz.left = Math.max(0.01, Math.min(dz.right - MIN_WIDTH, norm));
            } else {
                dz.right = Math.min(0.99, Math.max(dz.left + MIN_WIDTH, norm));
            }
            trackingDeadZone[dzDrag.slot] = dz;
            if (!trackingSettings[dzDrag.slot]) trackingSettings[dzDrag.slot] = {};
            trackingSettings[dzDrag.slot].deadZone = { ...dz };
            drawTrackingOverlay(dzDrag.slot, null, null);
            // Throttle saves to once per 300ms during drag
            clearTimeout(dzSaveTimer);
            dzSaveTimer = setTimeout(saveCameras, 300);
        });

        document.addEventListener('mouseup', () => {
            if (dzDrag) { dzDrag.streamEl.style.cursor = ''; dzDrag = null; }
        });

        // Canvas 2D context cache — getContext is cheap but not free; avoid per-frame lookup
        const canvasCtxCache = {};
        // Dirty tracking — skip redraw when nothing has changed
        const overlayLastState = {}; // slot → { left, right, kpCount }

        function drawTrackingOverlay(slot, keypoints, box) {
            const sec = document.querySelector(`.cam-section[data-slot="${slot}"]`);
            if (!sec) return;
            const canvas = sec.querySelector('.tracking-canvas');
            if (!canvas) return;
            const img = sec.querySelector('img');

            const stream = sec.querySelector('.cam-stream');
            if (!stream) return;

            let CW = img.clientWidth;
            let CH = img.clientHeight;
            if (CW < 50 || CH < 50) {
                CW = stream.clientWidth || 960;
                CH = stream.clientHeight || 540;
            }

            const dz = getDeadZone(slot);
            const kpCount = keypoints ? keypoints.length : 0;

            // Dirty check — skip draw if nothing changed
            const prev = overlayLastState[slot];
            if (prev &&
                prev.left === dz.left && prev.right === dz.right &&
                prev.kpCount === kpCount && kpCount === 0 &&
                prev.CW === CW && prev.CH === CH) {
                return;
            }
            overlayLastState[slot] = { left: dz.left, right: dz.right, kpCount, CW, CH };

            // Only resize the canvas buffer when dimensions actually change —
            // resetting width/height every frame forces a full GPU buffer
            // reallocation and is the single biggest source of frame jank on tablet.
            if (canvas.width !== CW || canvas.height !== CH) {
                canvas.width  = CW;
                canvas.height = CH;
                // Invalidate cached context after resize (browser may replace it)
                delete canvasCtxCache[slot];
            }

            // Cache the 2D context — getContext on every frame causes internal
            // hash-map lookup in the browser engine on every single draw call.
            if (!canvasCtxCache[slot]) {
                canvasCtxCache[slot] = canvas.getContext('2d', { willReadFrequently: false });
            }
            const ctx = canvasCtxCache[slot];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Account for object-fit: contain letterboxing
            // The image content may not fill the entire canvas
            const natW = img.naturalWidth && img.naturalWidth > 0 ? img.naturalWidth : 1920;
            const natH = img.naturalHeight && img.naturalHeight > 0 ? img.naturalHeight : 1080;
            const scale   = Math.min(CW / natW, CH / natH);
            const rendW   = natW * scale;
            const rendH   = natH * scale;
            const offX    = (CW - rendW) / 2;
            const offY    = (CH - rendH) / 2;

            // Map normalized coord (0-1 of natural image) → canvas pixel
            const px = nx => offX + nx * rendW;
            const py = ny => offY + ny * rendH;

            // Dead zone band with draggable boundary lines
            const lx = px(dz.left), rx = px(dz.right);

            // Semi-transparent fill between the two boundaries
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillRect(lx, offY, rx - lx, rendH);

            // Dead zone box outline
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.strokeRect(lx, offY, rx - lx, rendH);

            // Circle drag handles in the middle of each vertical side
            const midY = offY + rendH / 2;
            const R = 8;
            [lx, rx].forEach(x => {
                ctx.beginPath();
                ctx.arc(x, midY, R, 0, Math.PI * 2);
                ctx.fillStyle = '#ffff00';
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });
            ctx.lineWidth = 2;

            if (keypoints && keypoints.length > 0) {
                ctx.fillStyle = 'rgba(255,255,0,0.25)';
                for (const kp of keypoints) {
                    const canvasX = px(kp.x);
                    const canvasY = py(kp.y);
                    ctx.beginPath();
                    ctx.arc(canvasX, canvasY, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function clearTrackingOverlay(slot) {
            // Redraw with no keypoints/box — keeps the center indicator visible
            drawTrackingOverlay(slot, null, null);
        }

        function startTracking(slot) {
            stopTracking(slot);
            trackingActive[slot]  = true;
            trackingLost[slot]    = false;
            const sec = document.querySelector(`.cam-section[data-slot="${slot}"]`);
            if (sec) sec.querySelector('.tracking-status').textContent = 'Tracking active.';
            drawTrackingOverlay(slot, null, null);

        function stopTracking(slot) {
            trackingActive[slot] = false;
            const ip = getSlotIp(slot);
            if (ip) cgi(ip, '/cgi-bin/ptzctrl.cgi?ptzcmd&ptzstop');

        // Track active tab per slot, camera per slot, and snapshot intervals
        const sectionTabs      = {};
        const sectionCameras   = {};   // slot → camera id
        const sectionIntervals = {};   // slot → interval id
        let selectedSlot       = null;
        let presetNames        = {};   // { [camId]: { "1": "Name", ... } }

        function updatePresetLabels(slot) {
            const sec = document.querySelector(`.cam-section[data-slot="${slot}"]`);
            if (!sec) return;
            const camId = currentLayout === 1 ? stagingCamera : sectionCameras[slot];
            const names = camId && presetNames[camId] ? presetNames[camId] : {};
            sec.querySelectorAll('.preset-btn').forEach(btn => {
                const n = btn.dataset.preset;
                btn.textContent = names[n] || n;
                btn.title = names[n] ? `Preset ${n}: ${names[n]}` : `Preset ${n}`;
            });
        }

        function selectSlot(slot) {
            selectedSlot = slot;
            document.querySelectorAll('.cam-section').forEach(s =>
                s.classList.toggle('selected', +s.dataset.slot === slot)
            );

            document.getElementById('assign-hint').classList.add('visible');
        }

        function clearSlotSelection() {
            selectedSlot = null;
            document.querySelectorAll('.cam-section').forEach(s => s.classList.remove('selected'));
            document.getElementById('camera-list').classList.remove('assigning');
            document.getElementById('assign-hint').classList.remove('visible');
        }

        function startSnapshot(ip, img, slot) {
            stopSnapshot(slot);
            let active = true;
            // 15 fps cap: minimum 66 ms between frame requests
            const MIN_FRAME_MS = 67;
            sectionIntervals[slot] = { stop: () => { active = false; } };

            let lastFrameTime = 0;

            const next = () => {
                if (!active) return;
                const now = performance.now();
                const elapsed = now - lastFrameTime;
                if (elapsed < MIN_FRAME_MS) {
                    setTimeout(next, MIN_FRAME_MS - elapsed);
                    return;
                }
                lastFrameTime = now;
                img.src = `/api/snapshot/${ip}?t=${now|0}`;
            };

            img.onload = () => {
                if (!active) return;
                next();
            };
            img.onerror = () => { if (active) setTimeout(next, 1000); };
            next();
        }

        function stopSnapshot(slot) {
            if (sectionIntervals[slot]) {
                sectionIntervals[slot].stop();
                delete sectionIntervals[slot];
            }
        }

        function assignCameraToSlot(camId, slot) {
            stopSnapshot(slot);
            if (currentLayout === 1) {
                stagingCamera = camId;
                saveCameras();
            } else {
                sectionCameras[slot] = camId;
                saveCameras();
            }
            const cam = cameras.find(c => c.id === camId);
            const sec = document.querySelector(`.cam-section[data-slot="${slot}"]`);
            if (!sec || !cam) { clearSlotSelection(); return; }

            sec.classList.remove('no-camera');
            updatePresetLabels(slot);

            startSnapshot(cam.ip, img, slot);

            // Set camera URL for backend tracker
            fetch('/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cameraUrl: `http://${cam.ip}/snapshot.jpg`, cameraIp: cam.ip })
            }).catch(e => console.warn('[Config] Failed to set camera:', e));

            clearSlotSelection();

                                        <select class="setting-select" data-setting="iris">
                                            ${['Close','F11','F9.6','F8.0','F6.8','F5.6','F4.8','F4.0','F3.4','F2.8','F2.4','F2.0','F1.8'].map((v,i)=>`<option value="${i}">${v}</option>`).join('')}
                                        </select>
                                    </div>
                                    ${[
                                        { p:'gain_limit',   label:'Gain Limit',   min:0, max:15, val:7 },
                                        { p:'manual_gain',  label:'Manual Gain',  min:0, max:7,  val:0 },
                                        { p:'drc',          label:'DRC',          min:0, max:8,  val:3 },
                                        { p:'expcomp_level',label:'Exp Comp',     min:0, max:14, val:7 },
